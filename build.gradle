plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// 컴파일 대상(release)도 툴체인을 따른다. CI·배포 빌드·운영/dev 서버 런타임이 모두 25 라 따로 낮출 이유가 없다(#511 B10).
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jacoco {
	// 0.8.14 부터 Java 25 클래스 파일을 정식 지원한다
	toolVersion = '0.8.15'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.46.8')
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.2.0'

    // JWT (서비스용 HS256 + GitHub App용 RS256)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 폐기 토큰 인메모리 캐시. 직접 만들면 만료·크기 제한·동시성 제거를 손으로 쥐어야 하는데,
    // 이건 인증 경계라 그 자리에서 나는 버그의 대가가 크다. 버전은 Spring Boot BOM 이 관리하고
    // 전이 의존성이 없다.
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // PEM 키 파싱 (GitHub App PKCS1 private key)
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'   // 1.78.1 은 CVE-2025-8916·CVE-2026-5588(1.84 에서 수정)

    // Docker Java SDK
    // 3.7.1: 3.3.6's Capability enum can't deserialize the "CAP_"-prefixed capability names that
    // modern Docker Engine (confirmed against 29.6.1 / API 1.55) returns in `inspect` responses
    // once HostConfig.CapAdd/CapDrop is set (see DockerContainerService's preview isolation
    // policy) — inspectContainerCmd().exec() throws for every such container on 3.3.6. 3.7.1 adds
    // Capability.fromValue() (@JsonCreator) which strips the "CAP_" prefix before Enum.valueOf.
    implementation 'com.github.docker-java:docker-java-core:3.7.1'
    implementation 'com.github.docker-java:docker-java-transport-okhttp:3.7.1'

    // 서버 측 git 작업(#523). 컨테이너 작업 트리 스냅샷을 서버에서 커밋·push 하고 diff 를 만든다.
    // 버전 고정: 2026-09 최신 안정판(EDL 1.0).
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r'

    // Cloud connection verification
    implementation 'software.amazon.awssdk:sts'
    implementation 'software.amazon.awssdk:rds'
    implementation 'software.amazon.awssdk:ec2'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:iam'
    implementation 'software.amazon.awssdk:ecr'
    implementation 'software.amazon.awssdk:ssm'
    // S3 프론트 정적 사이트 HTTPS(CloudFront + ACM). ACM 인증서는 CloudFront 용이면 us-east-1 필수.
    implementation 'software.amazon.awssdk:cloudfront'
    implementation 'software.amazon.awssdk:acm'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.54.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
	// WorkflowPinningTest 가 워크플로 파일을 읽는다 — 입력으로 알려야 파일만 바뀌었을 때 테스트가 '최신'으로 건너뛰어지지 않는다.
	inputs.dir('.github/workflows').withPropertyName('workflows').withPathSensitivity(PathSensitivity.RELATIVE)
	// LocalDbProvisionerIntegrationTest 는 실행 중인 Docker 데몬을 요구해 기본 비활성이다.
	// 로컬에서 -Ddocker.it=true 로 켤 때만 그 값을 포크된 테스트 JVM 으로 전달해 실측한다.
	systemProperty 'docker.it', System.getProperty('docker.it', 'false')

	// GithubAppPermissionProbeIntegrationTest 는 실제 GitHub App 비공개 키로 외부 API 를 읽는다.
	// CI 에는 키가 없고, 있어도 테스트가 외부 상태에 의존하면 안 되므로 기본 비활성이다.
	systemProperty 'githubapp.it', System.getProperty('githubapp.it', 'false')

	// 웹훅 배달 워커의 폴링 주기를 테스트 동안 사실상 꺼둔다(기본 1000ms → 1시간). 이 워커는 항상 켜진
	// @Scheduled 빈이라, 통합 테스트가 심은 PENDING/RETRY_WAIT 행을 테스트가 claimPending 으로 집기
	// 전에 백그라운드에서 가로채 처리해버려 WebhookDeliveryClaimIntegrationTest 가 간헐적으로 실패했다.
	// @TestPropertySource 로는 한 클래스의 컨텍스트만 조용해질 뿐 다른 캐시된 컨텍스트의 워커가 같은
	// 공유 DB 를 계속 폴링해 소용없었다 — 시스템 프로퍼티는 테스트 JVM 의 모든 Spring 컨텍스트에 적용돼
	// 근본을 막는다. 이 워커 자동 폴링에 의존하는 테스트는 없다(그 클래스는 claimPending 을 직접 부른다).
	systemProperty 'qeploy.webhook.worker.poll-interval-ms', '3600000'

	// 테스트 JVM 의 커넥션 풀은 쓰는 만큼만 열어 둔다. dev 프로필의 풀은 20개 고정(minimum-idle = maximum-pool-size)인데,
	// Spring 테스트 컨텍스트는 캐시돼 JVM 이 끝날 때까지 닫히지 않는다. Spring 7 은 쓰지 않는 컨텍스트를 일시정지
	// (Lifecycle 빈 정지)하지만 커넥션 풀은 Lifecycle 이 아니라 그대로 열려 있다. 그래서 컨텍스트 수 × 20 이 MySQL 기본
	// 한도(max_connections 151)를 넘는다.
	// 넘으면 새 컨텍스트의 첫 커넥션이 "Too many connections" 로 실패해, 컨텍스트를 하나 더 만든 PR 과 상관없는 다른 테스트
	// 클래스가 뜨지 못한다(#643 작업 중 실제로 겪었다).
	// 실측(2026-11-10, 로컬 MySQL 8.0, 컨텍스트 8개):
	//   - 이 설정 없이: 최대 동시 연결이 한도에 붙었다(Max_used_connections 152 = 앱 151 + 측정에 쓴 관리자 연결 1). 컨텍스트를
	//     3개 더 만들자 그중 2개와 UserWithdrawalEndpointTest 의 컨텍스트가 "Too many connections" 로 뜨지 못했다.
	//   - 이 설정으로: 같은 측정에서 최대 19, 컨텍스트 3개를 더해도 23. 전체 테스트 시간은 같았다(2분 15초 → 2분 18초).
	// 상한(maximum-pool-size)은 그대로 둔다 — 여러 커넥션을 한꺼번에 쓰는 테스트는 예전처럼 쓰고, 쉬는 풀만 1개로 준다.
	// idle-timeout 10s 는 Hikari 가 허용하는 최솟값이다.
	systemProperty 'spring.datasource.hikari.minimum-idle', '1'
	systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
}

// 커버리지는 리포트만 낸다(게이트 없음). CI 가 HTML 을 아티팩트로 올린다.
tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}
