name: Deploy to EC2

# main에 커밋이 올라오면(= PR 병합 시) 바로 배포한다.
# pull_request가 아니라 push인 이유: pull_request는 병합 결과가 아니라 병합 후보를
# 빌드하고, 시크릿도 포크 PR에는 내려가지 않는다. push라 병합이 아닌 main 직접 푸시도
# 배포로 이어진다 — main을 보호 브랜치로 두고 PR로만 들어오게 하는 것을 전제한다.
# workflow_dispatch는 롤백 후 재배포처럼 코드 변경 없이 다시 돌려야 할 때 쓴다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 병합이 연달아 일어나도 배포가 겹치지 않게 직렬화한다.
# 배포 도중 취소하면 EC2가 어중간한 상태로 남으므로 cancel-in-progress는 끈다.
# 앞선 배포가 도는 중에 두 건이 더 쌓이면 GitHub이 중간 건을 버리고 마지막 것만 남기는데,
# 어차피 main의 최신 커밋이 올라가므로 결과는 같다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 배포 대상 경로(/opt/dvely)는 EC2의 dvely-deploy 래퍼가 소유한다.
  # 여기에 중복해 두면 양쪽이 어긋날 수 있다.
  APP_NAME: dvely

jobs:
  deploy:
    name: Build and deploy ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 돌리지 않는다. @SpringBootTest 3종(DvelyApplicationTests,
      # ProjectSchemaTest, CloudConnectionSchemaTest)이 실제 MySQL과 Flyway 마이그레이션,
      # 그리고 gitignore된 application-local.yml의 시크릿을 요구하기 때문이다.
      # CI에서 검증하려면 MySQL 서비스 컨테이너와 시크릿 주입을 먼저 붙여야 한다.
      - name: Build bootJar
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Resolve jar path
        run: |
          set -euo pipefail
          jar=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error::build/libs 에서 부팅 가능한 jar를 찾지 못했습니다."
            exit 1
          fi
          cp "$jar" build/libs/app.jar
          # EC2의 래퍼가 설치 직전에 대조한다. 경로가 아니라 파일명만 담아야 staging
          # 디렉터리에서 그대로 `sha256sum -c` 가 통한다.
          (cd build/libs && sha256sum app.jar > app.jar.sha256)
          echo "배포 대상: $jar ($(du -h "$jar" | cut -f1))"

      # staging 디렉터리는 EC2에 root:${EC2_USER} 0770 으로 미리 만들어 둔다.
      # /tmp 처럼 아무나 만들 수 있는 위치에 두면 디렉터리를 선점당해 jar가 바꿔치기된다.
      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: build/libs/app.jar,build/libs/app.jar.sha256
          target: /var/lib/${{ env.APP_NAME }}/staging
          strip_components: 2

      - name: Swap jar and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: APP_NAME,RELEASE_SHA
          script_stop: true
          script: |
            set -euo pipefail

            # jar 교체와 재시작은 인자를 받지 않는 래퍼가 root로 수행한다.
            # install/cp 에 직접 sudo를 주면 인자 제한이 없어 무제한 root 권한이 된다.
            sudo /usr/local/sbin/dvely-deploy

            # Type=simple이라 systemd는 프로세스가 뜨는 즉시 active로 본다.
            # Flyway validate 실패나 빈 생성 오류는 그보다 늦게 터지므로
            # is-active만으로는 "배포 성공, 앱은 사망"을 걸러내지 못한다.
            # 실제로 HTTP 요청을 받을 수 있을 때까지 health를 폴링한다.
            healthy=0
            for _ in $(seq 1 45); do
              if curl -fsS -o /dev/null "http://127.0.0.1:8080/actuator/health"; then
                healthy=1
                break
              fi
              # 프로세스가 이미 죽었다면 더 기다릴 이유가 없다.
              if ! systemctl is-active --quiet "${APP_NAME}"; then
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "::error::${APP_NAME}가 90초 안에 health 응답을 내지 못했습니다. 최근 로그:"
              journalctl -u "${APP_NAME}" -n 50 --no-pager || true
              exit 1
            fi
            echo "${RELEASE_SHA} 배포 완료"
        env:
          # 커밋 메시지나 브랜치명은 원격 셸로 넘기지 않는다. 이 값들은 사용자가 임의로
          # 정할 수 있어 따옴표나 명령 치환이 섞여 들어갈 수 있다. sha는 16진수뿐이라 안전하다.
          RELEASE_SHA: ${{ github.sha }}
