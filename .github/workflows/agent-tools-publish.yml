name: Publish agent-tools to npm

# @qeploy/client·mcp·cli 를 npm 에 올린다. 사람이 Actions 화면에서 직접 누를 때만 돈다 —
# 한 번 올린 버전은 되돌릴 수 없고, 사용자가 npx 로 받아 자기 컴퓨터에서 바로 실행하는 패키지다.
#
# 인증은 npm Trusted Publishing(OIDC)이다. 저장소에 npm 토큰을 두지 않는다. npmjs.com 의 각
# 패키지 Settings → Trusted Publisher 에 이 저장소와 이 파일 이름(agent-tools-publish.yml)을
# 등록해야 동작한다(세 패키지 각각). 파일 이름을 바꾸면 그 등록도 바꿔야 한다.
#
# 이미 레지스트리에 있는 버전은 건너뛴다. 버전을 올리지 않고 누르면 아무것도 올라가지 않는다.
on:
  workflow_dispatch:

concurrency:
  group: agent-tools-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Trusted Publishing 이 OIDC 토큰을 받는 자리

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 아무 브랜치에서나 누를 수 있으면 리뷰 안 된 코드가 패키지로 나간다. 머지된 것만 올린다.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: agent-tools

    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing 은 npm 11.5.1 이상을 요구한다. Node 24 에 들어 있는 npm 이 그 이상이다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm ci 가 아니다 — agent-tools/.gitignore 가 package-lock.json 을 빼고 있어 ci 는 lock 이 없다며 죽는다.
      - run: npm install --no-audit --no-fund
      - run: npm test

      # client 가 먼저다 — mcp·cli 가 그 버전을 의존한다. 하나라도 실패하면 거기서 멈춘다.
      - name: Publish packages
        run: |
          for p in client mcp cli; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version 은 이미 있다 — 건너뛴다"
              continue
            fi
            (cd "packages/$p" && npm publish)
          done
