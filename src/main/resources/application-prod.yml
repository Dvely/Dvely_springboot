spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

cloudflare:
  # 값은 서버 환경변수로만 넣는다 — 이 파일에 적으면 저장소로 새어 나간다.
  # 비어 있으면 도메인 연결 요청이 Cloudflare 인증에서 실패한다.
  api-token: ${CLOUDFLARE_API_TOKEN:}
  zone-id: ${CLOUDFLARE_ZONE_ID:}
  managed-domain: ${CLOUDFLARE_MANAGED_DOMAIN:qeploy.com}
  managed-target: ${CLOUDFLARE_MANAGED_TARGET:}
  api-base-url: https://api.cloudflare.com/client/v4
  ttl: 1
  proxied: true

qeploy:
  cors:
    allowed-origins: ${QEPLOY_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${QEPLOY_CORS_ALLOWED_ORIGIN_PATTERNS:}
  preview:
    # 프리뷰 주소(`previewUrl`)의 기준 오리진. FE와 API가 같은 도메인을 쓰므로 서비스 도메인을
    # 그대로 둔다. 비워두면 application.yaml의 기본값(http://localhost:8080)이 적용되어, 발급된
    # 주소를 브라우저가 열 수 없다 — 실제로 이 환경변수를 넣은 적이 없어 그 상태였다.
    gateway-base-url: ${QEPLOY_PREVIEW_GATEWAY_BASE_URL:https://qeploy.com}
  ai:
    anthropic:
      api-key: ${QEPLOY_AI_ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
      model: ${QEPLOY_AI_ANTHROPIC_MODEL:claude-opus-4-5-20251101}
      # 요청(DecisionRequest.model)이 지정할 수 있는 추가 모델. 비우면 위 model만 허용된다 —
      # 넓히는 것은 비용 결정이므로 기본값은 최소 권한이다.
      allowed-models: ${QEPLOY_AI_ANTHROPIC_ALLOWED_MODELS:}
      # thinking(사고 깊이)을 지원하는 모델. 목록 밖 모델에 thinking을 요청하면 400으로 거절한다.
      thinking-models: ${QEPLOY_AI_ANTHROPIC_THINKING_MODELS:claude-opus-4-5-20251101}
    openai:
      api-key: ${QEPLOY_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      model: ${QEPLOY_AI_OPENAI_MODEL:gpt-4o}
      allowed-models: ${QEPLOY_AI_OPENAI_ALLOWED_MODELS:}
      # gpt-4o는 reasoning_effort를 받지 않으므로 기본값은 비어 있다. o-시리즈 등 추론 모델을
      # allowed-models에 추가할 때 함께 등록한다.
      thinking-models: ${QEPLOY_AI_OPENAI_THINKING_MODELS:}
    glm:
      # OpenRouter 경유 GLM. OpenRouter 는 OpenAI 챗 컴플리션 형식을 그대로 쓰므로 전송 규격은
      # openai 와 같고, 키/엔드포인트/모델 슬러그만 다르다.
      api-key: ${QEPLOY_AI_GLM_API_KEY:${OPENROUTER_API_KEY:}}
      model: ${QEPLOY_AI_GLM_MODEL:z-ai/glm-4.6}
      allowed-models: ${QEPLOY_AI_GLM_ALLOWED_MODELS:}
      # thinking 을 지원하는 모델. 목록 밖 모델에 thinking 을 요청하면 조용히 무시하지 않고
      # 400 으로 거절한다. Z.ai 직결이면 Z.ai 모델명을 넣는다(예: glm-4.7-flash) —
      # 여기 기본값은 OpenRouter 슬러그라 Z.ai 모델명과 매칭되지 않는다.
      thinking-models: ${QEPLOY_AI_GLM_THINKING_MODELS:z-ai/glm-4.6}
      # 챗 컴플리션 전체 URL(호스트 접두사가 아니다). Z.ai 직결이나 자체 게이트웨이로 바꿀 때 쓴다.
      # 이 값이 게이트웨이 선언이다 — 오류 문구의 제공자 이름과 thinking 표기가 여기서 유도된다.
      # Z.ai 직결로 돌릴 경우 모델 슬러그에 접두사가 없다(z-ai/glm-4.6 이 아니라 glm-4.6).
      # thinking 은 게이트웨이마다 표기가 다른데 base-url 을 보고 자동으로 맞춘다:
      #   OpenRouter → reasoning:{effort}   ·   Z.ai → thinking:{type}
      # 다만 Z.ai 에는 단계가 없다. LOW/MEDIUM/HIGH 가 모두 같은 "켜짐"으로 간다(2026-09-03 실측).
      # 참고: glm-4.7-flash 는 /models 목록에 없지만 실재하며 무료다. 기본적으로 추론하므로
      # thinking 을 끈 요청에는 thinking:{type:disabled} 를 명시적으로 보내 실제로 끈다
      # (실측: disabled 를 보내면 reasoning_tokens 가 0 이 된다). 무료 티어라 429(code 1305
      # overloaded)가 잦은데, 이는 재시도 가능 사유로 올바르게 분류되어 위 retry 가 흡수한다.
      base-url: ${QEPLOY_AI_GLM_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
      # OpenRouter 대시보드/랭킹에서 이 서비스 호출을 식별하는 선택 헤더. 비우면 보내지 않는다.
      referer: ${QEPLOY_AI_GLM_REFERER:}
      title: ${QEPLOY_AI_GLM_TITLE:}
    retry:
      # 제공자 호출이 일시적으로 실패했을 때(429·5xx·연결 타임아웃) 다시 시도하는 횟수와 간격.
      # AgentPlanExecutor 는 제공자 예외를 받으면 태스크를 닫으므로, 여기서 흡수하지 못한
      # 일시 실패는 곧 작업 전체의 실패다. 키 없음·인증 실패·크레딧 부족은 재시도해도 소용없어
      # 즉시 실패한다. CODE 에이전트는 라운드마다 이 예산을 쓰므로 기본값을 낮게 둔다.
      max-attempts: ${QEPLOY_AI_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${QEPLOY_AI_RETRY_INITIAL_DELAY_MS:1000}
      # 한 번의 대기 상한. 제공자가 Retry-After 로 더 긴 시간을 요구해도 이 값으로 자른다.
      max-delay-ms: ${QEPLOY_AI_RETRY_MAX_DELAY_MS:8000}
    code-agent:
      # CODE 스텝 1회 실행에서 허용하는 LLM 왕복 횟수. 소진되면 성공이 아니라 실패로 처리되고
      # 같은 컨테이너에서 이어서 재시도된다(AgentIterationLimitException).
      max-iterations: ${QEPLOY_AI_CODE_AGENT_MAX_ITERATIONS:40}
