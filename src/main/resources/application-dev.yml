spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

cloudflare:
  # 값은 서버 환경변수로만 넣는다 — 이 파일에 적으면 저장소로 새어 나간다.
  # 비어 있으면 도메인 연결 요청이 Cloudflare 인증에서 실패한다.
  api-token: ${CLOUDFLARE_API_TOKEN:}
  zone-id: ${CLOUDFLARE_ZONE_ID:}
  managed-domain: ${CLOUDFLARE_MANAGED_DOMAIN:qeploy.com}
  managed-target: ${CLOUDFLARE_MANAGED_TARGET:}
  api-base-url: https://api.cloudflare.com/client/v4
  ttl: 1
  proxied: true

qeploy:
  cors:
    allowed-origins: ${QEPLOY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-origin-patterns: ${QEPLOY_CORS_ALLOWED_ORIGIN_PATTERNS:}
  preview:
    # 개발 서버의 도메인은 환경마다 다르므로 고정값을 두지 않는다. 비워두면
    # PreviewGatewayUrlResolver가 CORS 허용 오리진(= FE가 실제로 API를 호출하는 그 오리진)에서
    # 기준 오리진을 유추하므로, 서버에 환경변수를 추가하지 않아도 열리는 주소가 나온다.
    # 도메인을 따로 쓴다면 이 환경변수로 명시하는 편이 안전하다.
    gateway-base-url: ${QEPLOY_PREVIEW_GATEWAY_BASE_URL:}
    # dev 는 FE 가 각자 로컬(localhost:5173)에서 뜨고 게이트웨이는 이 서버라 항상 cross-site 다.
    # 소유권 쿠키는 SameSite=Lax 라 그 경계를 못 넘어 프리뷰 문서 요청이 전부 401 이 된다
    # (2026-08-15 실측: 동기화로 #77 G2 가 dev 에 들어온 직후부터 401, 그 전날까지는 200).
    # 운영은 FE 와 게이트웨이가 같은 사이트라 영향이 없으므로 기본값 true 를 유지하고,
    # dev 에서만 끈다. 끈 동안에는 "URL 을 아는 자 = 접근 허가" 모델로 돌아간다.
    require-access-cookie: ${QEPLOY_PREVIEW_REQUIRE_ACCESS_COOKIE:false}
    # 위와 같은 이유로 프레이밍도 dev 에서만 넓힌다. FE 가 각자 로컬에서 뜨고 게이트웨이는 이
    # 서버라 'self' 로는 인앱 프리뷰가 통째로 차단된다(iframe 이 빈 화면이 된다). 운영은 같은
    # 사이트라 기본값 'self' 를 그대로 쓴다.
    frame-ancestors: "${QEPLOY_PREVIEW_FRAME_ANCESTORS:'self' http://localhost:5173}"
  ai:
    anthropic:
      api-key: ${QEPLOY_AI_ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
      model: ${QEPLOY_AI_ANTHROPIC_MODEL:claude-opus-4-5-20251101}
      # 요청(DecisionRequest.model)이 지정할 수 있는 추가 모델. 비우면 위 model만 허용된다 —
      # 넓히는 것은 비용 결정이므로 기본값은 최소 권한이다.
      allowed-models: ${QEPLOY_AI_ANTHROPIC_ALLOWED_MODELS:}
      # thinking(사고 깊이)을 지원하는 모델. 목록 밖 모델에 thinking을 요청하면 400으로 거절한다.
      thinking-models: ${QEPLOY_AI_ANTHROPIC_THINKING_MODELS:claude-opus-4-5-20251101}
    openai:
      api-key: ${QEPLOY_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      model: ${QEPLOY_AI_OPENAI_MODEL:gpt-4o}
      allowed-models: ${QEPLOY_AI_OPENAI_ALLOWED_MODELS:}
      # gpt-4o는 reasoning_effort를 받지 않으므로 기본값은 비어 있다. o-시리즈 등 추론 모델을
      # allowed-models에 추가할 때 함께 등록한다.
      thinking-models: ${QEPLOY_AI_OPENAI_THINKING_MODELS:}
    glm:
      # OpenRouter 경유 GLM. OpenRouter 는 OpenAI 챗 컴플리션 형식을 그대로 쓰므로 전송 규격은
      # openai 와 같고, 키/엔드포인트/모델 슬러그만 다르다.
      api-key: ${QEPLOY_AI_GLM_API_KEY:${OPENROUTER_API_KEY:}}
      model: ${QEPLOY_AI_GLM_MODEL:z-ai/glm-4.6}
      allowed-models: ${QEPLOY_AI_GLM_ALLOWED_MODELS:}
      # thinking 을 지원하는 모델. 목록 밖 모델에 thinking 을 요청하면 조용히 무시하지 않고
      # 400 으로 거절한다. Z.ai 직결이면 Z.ai 모델명을 넣는다(예: glm-4.7-flash) —
      # 여기 기본값은 OpenRouter 슬러그라 Z.ai 모델명과 매칭되지 않는다.
      thinking-models: ${QEPLOY_AI_GLM_THINKING_MODELS:z-ai/glm-4.6}
      # 챗 컴플리션 전체 URL(호스트 접두사가 아니다). Z.ai 직결이나 자체 게이트웨이로 바꿀 때 쓴다.
      # 이 값이 게이트웨이 선언이다 — 오류 문구의 제공자 이름과 thinking 표기가 여기서 유도된다.
      # Z.ai 직결로 돌릴 경우 모델 슬러그에 접두사가 없다(z-ai/glm-4.6 이 아니라 glm-4.6).
      # thinking 은 게이트웨이마다 표기가 다른데 base-url 을 보고 자동으로 맞춘다:
      #   OpenRouter → reasoning:{effort}   ·   Z.ai → thinking:{type}
      # 다만 Z.ai 에는 단계가 없다. LOW/MEDIUM/HIGH 가 모두 같은 "켜짐"으로 간다(2026-09-03 실측).
      # 참고: glm-4.7-flash 는 /models 목록에 없지만 실재하며 무료다. 기본적으로 추론하므로
      # thinking 을 끈 요청에는 thinking:{type:disabled} 를 명시적으로 보내 실제로 끈다
      # (실측: disabled 를 보내면 reasoning_tokens 가 0 이 된다). 무료 티어라 429(code 1305
      # overloaded)가 잦은데, 이는 재시도 가능 사유로 올바르게 분류되어 위 retry 가 흡수한다.
      base-url: ${QEPLOY_AI_GLM_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
      # OpenRouter 대시보드/랭킹에서 이 서비스 호출을 식별하는 선택 헤더. 비우면 보내지 않는다.
      referer: ${QEPLOY_AI_GLM_REFERER:}
      title: ${QEPLOY_AI_GLM_TITLE:}
    retry:
      # 제공자 호출이 일시적으로 실패했을 때(429·5xx·연결 타임아웃) 다시 시도하는 횟수와 간격.
      # AgentPlanExecutor 는 제공자 예외를 받으면 태스크를 닫으므로, 여기서 흡수하지 못한
      # 일시 실패는 곧 작업 전체의 실패다. 키 없음·인증 실패·크레딧 부족은 재시도해도 소용없어
      # 즉시 실패한다. CODE 에이전트는 라운드마다 이 예산을 쓰므로 기본값을 낮게 둔다.
      max-attempts: ${QEPLOY_AI_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${QEPLOY_AI_RETRY_INITIAL_DELAY_MS:1000}
      # 한 번의 대기 상한. 제공자가 Retry-After 로 더 긴 시간을 요구해도 이 값으로 자른다.
      max-delay-ms: ${QEPLOY_AI_RETRY_MAX_DELAY_MS:8000}
    code-agent:
      # CODE 스텝 1회 실행에서 허용하는 LLM 왕복 횟수. 소진되면 성공이 아니라 실패로 처리되고
      # 같은 컨테이너에서 이어서 재시도된다(AgentIterationLimitException).
      max-iterations: ${QEPLOY_AI_CODE_AGENT_MAX_ITERATIONS:40}

  # BYOK 코딩 에이전트(사용자 본인 공식 API 키로 벤더 CLI 를 헤드리스 실행).
  # qeploy.ai.code-agent(위, CODE 스텝의 LLM 왕복 예산)와는 다른 축이다 — 이름이 비슷하니 주의.
  coding-agent:
    # 로컬에서 빌드한 전용 이미지. 레지스트리에서 pull 하지 않는다 — 없으면 명확히 실패한다
    # (같은 이름의 공개 이미지가 사용자 실키를 받아 실행되는 일을 막기 위함).
    # 빌드: docker build -t qeploy/coding-agent:local docker/coding-agent
    image: ${QEPLOY_CODING_AGENT_IMAGE:qeploy/coding-agent:local}
    # 호스트 체크아웃을 컨테이너 안 이 경로에 bind mount 한다.
    workspace-mount-path: ${QEPLOY_CODING_AGENT_WORKSPACE:/workspace}
    # 1회 실행 벽시계 상한. 초과하면 컨테이너째 정리하고 timedOut 으로 보고한다.
    timeout: ${QEPLOY_CODING_AGENT_TIMEOUT:10m}
    # 컨테이너 준비(이미지 확인·생성·기동) 실패에만 적용되는 재시도. CLI 가 이미 실행된 뒤의
    # 실패는 워크스페이스가 반쯤 수정됐을 수 있어 재시도하지 않는다.
    max-provision-attempts: ${QEPLOY_CODING_AGENT_PROVISION_ATTEMPTS:3}
    provision-retry-delay: ${QEPLOY_CODING_AGENT_PROVISION_RETRY_DELAY:2s}
    # 각 CLI 의 비대화 실행 인자(프롬프트는 맨 뒤에 별도 인자로 붙는다). 이 부분만 외부 도구가
    # 소유하므로 설정으로 뺐다 — CLI 버전을 올렸는데 인자 형식이 바뀌면 Dockerfile 의 버전 핀과
    # 여기를 함께 옮기면 되고, 코드 변경이 필요 없다.
    claude:
      argv-prefix: ${QEPLOY_CODING_AGENT_CLAUDE_ARGV:claude,-p}
      # 비우면 CLI 기본 모델을 쓴다. 두 CLI 모두 --model 플래그를 받는다.
      model: ${QEPLOY_CODING_AGENT_CLAUDE_MODEL:}
    codex:
      # --dangerously-bypass-approvals-and-sandbox 는 지름길이 아니라 필수다. Codex 자체 샌드박스는
      # bubblewrap 을 쓰고 그건 user namespace 를 요구하는데, 우리 컨테이너는 모든 capability 를
      # 떨구고 no-new-privileges 를 걸어 bubblewrap 이 뜨지 못한다 — 그 상태에서는 에이전트의 셸
      # 툴 호출이 전부 exit 1 로 죽고, 실측에서 "성공" 을 보고하면서 파일을 하나도 만들지 못했다.
      # 이 플래그의 문서가 바로 이 경우를 가리킨다("외부에서 이미 샌드박싱된 환경 전용").
      # 일회용 컨테이너가 그 외부 샌드박스다: 퍼블리시 포트 없음, 메모리·pids 상한, 워크스페이스만 마운트.
      argv-prefix: ${QEPLOY_CODING_AGENT_CODEX_ARGV:codex,exec,--dangerously-bypass-approvals-and-sandbox}
      # Codex 는 OPENAI_API_KEY 환경변수를 읽지 않는다(codex-cli 0.153.2 실측: 401 Missing bearer).
      # 이 로그인 명령을 먼저 실행하고 키를 stdin 으로 넘긴 뒤에야 codex exec 가 인증된다.
      login-argv: ${QEPLOY_CODING_AGENT_CODEX_LOGIN_ARGV:codex,login,--with-api-key}
      # CLI 기본값은 gpt-5.6-sol 이지만 가장 싼 등급으로도 같은 일이 끝난다(실측: luna 9,692 토큰
      # vs sol 11,203 토큰, 동일 프롬프트). 기본으로 큰 모델을 태울 이유가 없다.
      model: ${QEPLOY_CODING_AGENT_CODEX_MODEL:gpt-5.6-luna}
    # 에이전트 네트워크 격리. Codex 자체 샌드박스를 우회하면서 그 샌드박스가 주로 막던 것(모델이
    # 만든 셸 명령의 네트워크 접근)이 통째로 비었기 때문에 필요하다. 없으면 에이전트 컨테이너가 기본
    # 브리지에 붙어 제한 없이 나가고, Codex 가 레포의 AGENTS.md 를 자동으로 읽는다는 점에서 신뢰할 수
    # 없는 레포가 곧 지시문이 되므로, 사용자 키를 임의 주소로 보내거나 호스트 게이트웨이의 서비스에
    # 닿을 수 있다.
    # 구조: internal 네트워크(기본 경로 자체가 없음) + 유일하게 바깥으로 나갈 수 있는 프록시 사이드카
    # (CONNECT 를 호스트명으로 필터). 실 데몬 실측: 허용 API 는 응답하고, 비허용 호스트·프록시 우회
    # 직접 연결·호스트 게이트웨이는 전부 차단된다.
    egress:
      # 끄면 에이전트가 기본 브리지로 돌아가 제한 없이 나간다.
      enabled: ${QEPLOY_CODING_AGENT_EGRESS_ENABLED:true}
      network-name: ${QEPLOY_CODING_AGENT_EGRESS_NETWORK:qeploy-coding-agent}
      proxy-alias: ${QEPLOY_CODING_AGENT_EGRESS_PROXY_ALIAS:qeploy-egress}
      proxy-port: ${QEPLOY_CODING_AGENT_EGRESS_PROXY_PORT:8888}
      # 통째로 일치시킨다(점을 이스케이프한 앵커 정규식). api.openai.com 이 api.openai.com.evil.test
      # 까지 허용하지 않는다.
      allowed-hosts: ${QEPLOY_CODING_AGENT_EGRESS_ALLOWED_HOSTS:api.anthropic.com,api.openai.com}
