<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Qeploy 화면 공유</title>
<style>
:root{--bg:#f4f4f5;--bar:#fff;--fg:#18181b;--mut:#52525b;--line:#d4d4d8;--stage:#e4e4e7;--ov:rgba(244,244,245,.88);--btn:#fff;--btn-h:#ececef;--pri:#1d4ed8;--pri-h:#1e40af;--focus:#2563eb;--on:#16a34a;--wait:#ca8a04;--off:#dc2626;--end:#71717a;--pin:#a21caf;--pin-fg:#fff;--pin-bg:rgba(162,28,175,.16);--shadow:0 6px 24px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--bar:#18181b;--fg:#f4f4f5;--mut:#a1a1aa;--line:#3f3f46;--stage:#000;--ov:rgba(9,9,11,.85);--btn:#27272a;--btn-h:#3f3f46;--pri:#2563eb;--pri-h:#1d4ed8;--focus:#93c5fd;--on:#4ade80;--wait:#facc15;--off:#f87171;--end:#a1a1aa;--pin:#f0abfc;--pin-fg:#18181b;--pin-bg:rgba(240,171,252,.2);--shadow:0 6px 24px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.state.on{--c:var(--on)}.state.wait{--c:var(--wait)}.state.off{--c:var(--off)}.state.end{--c:var(--end)}
.url{flex:1 1 12rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.meta{display:inline-flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut)}
.meta span{white-space:nowrap}
.acts{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto}
button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:6px;min-height:32px;padding:4px 12px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){background:var(--btn-h)}
button:disabled{opacity:.55;cursor:default}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){background:var(--pri-h)}
button.icon{min-width:36px;padding:4px 8px;font-size:16px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#ttl{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#stage.ctl #screen{touch-action:pinch-zoom}
#stage.typing::after{content:"";position:absolute;inset:0;border:2px solid var(--focus);pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--ov);text-align:center;pointer-events:none}
.ov .t{margin:0;font-size:17px;font-weight:600}
.ov .s{margin:6px 0 0;color:var(--mut)}
#namebox{position:fixed;z-index:10;pointer-events:auto}
#nameform{width:100%;max-width:22rem;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:20px;text-align:left}
#nameform h1{margin:0 0 6px;font-size:18px}
#nameform p{margin:0 0 14px;color:var(--mut)}
#nameform label{display:block;font-weight:600;margin-bottom:4px}
#name{display:block;width:100%;font:inherit;font-size:16px;padding:8px 10px;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#nameform button{width:100%;min-height:40px}
#typing{position:absolute;left:8px;top:8px;padding:4px 8px;border:1px solid var(--focus);border-radius:6px;background:var(--bar);font-size:12px;pointer-events:none}
#kbd{position:fixed;left:0;top:0;width:1px;height:1px;padding:0;border:0;opacity:0;resize:none;font-size:16px;caret-color:transparent;pointer-events:none}
#toast{position:fixed;left:50%;bottom:16px;z-index:20;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:8px 14px;border-radius:6px;background:var(--fg);color:var(--bg);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 짚기 피드백(설계 §14) */
button[aria-pressed="true"]{background:var(--pin);border-color:var(--pin);color:var(--pin-fg);font-weight:600}
button[aria-pressed="true"]:hover:not(:disabled){background:var(--pin)}
#b-mine.alert{border-color:var(--pin)}
#mine-n:not(:empty){display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--pin);color:var(--pin-fg);font-size:12px;font-weight:700;line-height:18px;text-align:center}
#stage.pin #screen{cursor:crosshair;touch-action:pinch-zoom}
#pin-rect{position:absolute;border:2px dashed var(--pin);border-radius:2px;background:var(--pin-bg);pointer-events:none}
#pinhint{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);padding:4px 8px;border:1px solid var(--pin);border-radius:6px;background:var(--bar);font-size:12px;pointer-events:none}
#pin-box{position:absolute;border:2px solid var(--pin);border-radius:3px;background:var(--pin-bg);box-shadow:0 0 0 1px rgba(255,255,255,.8);pointer-events:none}
#pin-dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid var(--pin);border-radius:50%;background:var(--pin-bg);box-shadow:0 0 0 1px rgba(255,255,255,.8);pointer-events:none}
#pin-dot.wait{animation:pinwait 1s ease-in-out infinite}
#pinhint button{pointer-events:auto;margin-left:6px;padding:1px 8px;font-size:12px}
#pin-orig{position:absolute;border:1px solid var(--pin);border-radius:3px;opacity:.6;pointer-events:none}
#pin-prev{position:absolute;border:2px dashed var(--pin);border-radius:3px;pointer-events:none}
#pin-marks{position:absolute;inset:0;pointer-events:none}
#pin-peerbox{position:absolute;inset:0;pointer-events:none}
.pin-peer{position:absolute;border:2px dashed var(--pin);border-radius:3px;opacity:.75;pointer-events:none}
.pin-other{position:absolute;border:2px solid var(--pin);border-radius:3px;opacity:.5;pointer-events:none}
.pin-badge{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--pin);color:var(--pin-fg);font-size:14px;font-weight:700;line-height:22px;text-align:center;box-shadow:0 0 0 2px rgba(255,255,255,.85);pointer-events:none}
.pin-badge.on{box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 4px var(--focus)}
#sh-marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#sh-marks li{display:flex;align-items:center;gap:6px;min-width:0}
#sh-marks .mk-n{flex:none;padding:2px 6px;font-weight:700}
#sh-marks .mk-l{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sh-marks li.on .mk-l{border-color:var(--pin);font-weight:600}
#sh-cf{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--wait);border-radius:6px}
#sh-add{align-self:flex-start}
#pin-scope{position:absolute;z-index:3;display:flex;gap:4px;max-width:calc(100% - 16px);overflow-x:auto;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bar);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#pin-scope button{flex:none;white-space:nowrap;padding:2px 8px;font-size:12px}
#pin-scope button[aria-checked="true"]{background:var(--pin);border-color:var(--pin);color:#fff}
#pin-scope .pin-peers{margin-left:4px;border-style:dashed}
#pin-scope .pin-peers[aria-pressed="true"]{background:var(--pin);border-color:var(--pin);border-style:solid;color:#fff}
#sheet #pin-scope{position:static;max-width:none;padding:0 0 2px;border:0;background:none;box-shadow:none}
#sh-w{align-self:flex-start;font-size:12px;padding:2px 8px}
@keyframes pinwait{50%{transform:scale(1.6);opacity:.55}}
.card{position:absolute;z-index:5;background:var(--bar);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
#sheet{left:12px;right:12px;bottom:12px;max-width:24rem;margin-left:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#sheet.top{bottom:auto;top:12px}
#sheet.left{margin-left:0;margin-right:auto}
#sheet p{margin:0}
#sh-t{font-weight:600;overflow-wrap:anywhere}
#sh-s,#sh-h,.fb-d{color:var(--mut);font-size:13px}
#sheet textarea,.fb textarea{display:block;width:100%;min-height:4.5em;max-height:40vh;resize:vertical;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
#sh-n{margin-right:auto;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#mine{top:8px;right:8px;z-index:6;width:calc(100% - 16px);max-width:24rem;max-height:calc(100% - 16px);overflow:auto;padding:12px}
#mine .head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#mine h2{margin:0;font-size:15px}
#mine .head p{margin:0 auto 0 0;color:var(--mut);font-size:12px}
#mine ul{list-style:none;margin:0;padding:0}
.fb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.fb p{margin:0}
.fb-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.fb-l{font-weight:600;min-width:0;overflow-wrap:anywhere}
.fb-c{white-space:pre-wrap;overflow-wrap:anywhere}
.fb-n{padding:6px 8px;border-left:3px solid var(--pin);background:var(--pin-bg);border-radius:0 4px 4px 0;overflow-wrap:anywhere}
.chip{flex:none;padding:0 6px;border:1px solid var(--c);border-radius:9px;color:var(--c);font-size:12px;font-weight:600;line-height:18px}
.s-NEW{--c:var(--wait)}.s-ACCEPTED{--c:var(--pri)}.s-DISMISSED{--c:var(--end)}.s-FIXED{--c:var(--pin)}.s-CONFIRMED{--c:var(--on)}
@media (pointer:coarse){button{min-height:40px}button.icon{min-width:44px}#pinhint .kb{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}#pin-dot.wait{animation:none}}
</style>
</head>
<body>
<header id="bar">
  <span id="state" class="state wait" aria-live="polite"><i aria-hidden="true"></i><span id="state-t">연결 중</span></span>
  <span class="url"><span class="sr">현재 주소: </span><span id="url">—</span></span>
  <span class="meta" id="meta"><span id="viewers">보는 사람 0명</span><span id="ctl">조작 중: 없음</span><span id="ttl" hidden></span></span>
  <span class="acts">
    <button type="button" id="b-back" class="icon" aria-label="뒤로" title="뒤로" hidden>←</button>
    <button type="button" id="b-fwd" class="icon" aria-label="앞으로" title="앞으로" hidden>→</button>
    <button type="button" id="b-reload" class="icon" aria-label="새로고침" title="새로고침" hidden>↻</button>
    <button type="button" id="b-kbd" hidden>키보드</button>
    <button type="button" id="b-pin" aria-pressed="false" title="화면의 한 곳을 짚어 고칠 점을 남깁니다" hidden>짚기</button>
    <button type="button" id="b-mine" aria-expanded="false" aria-controls="mine" hidden>내 피드백<span id="mine-n"></span></button>
    <button type="button" id="b-rel" hidden>조작 그만</button>
    <button type="button" id="b-req" class="pri" hidden>조작 요청</button>
  </span>
</header>
<main id="stage">
  <canvas id="screen" role="img" aria-label="공유된 앱 화면"></canvas>
  <div id="ov" class="ov" role="status" hidden><div><p id="ov-t" class="t"></p><p id="ov-s" class="s"></p></div></div>
  <div id="typing" hidden>키보드 입력을 기기로 보냅니다 · Esc 두 번: 나가기</div>
  <div id="pinhint" hidden><span id="pinhint-t">짚기 — 고칠 곳을 누르세요. 기기는 조작되지 않습니다</span><span class="kb"> · Shift+누르기: 더 짚기 · Esc: 끝내기</span><button type="button" id="b-whole" hidden>화면 전체</button></div>
  <div id="pin-rect" hidden></div>
  <div id="pin-orig" hidden></div>
  <div id="pin-box" hidden></div>
  <div id="pin-prev" hidden></div>
  <div id="pin-dot" hidden></div>
  <div id="pin-marks"></div>
  <div id="pin-peerbox"></div>
  <div id="pin-scope" role="radiogroup" aria-label="범위 — 넓히기·좁히기는 Alt+위·아래" hidden></div>
  <section id="sheet" class="card" aria-label="짚은 곳에 글 남기기" hidden>
    <ul id="sh-marks" aria-label="짚은 곳" hidden></ul>
    <p id="sh-t" aria-live="polite"></p>
    <p id="sh-s"></p>
    <div id="sh-cf" role="alert" hidden><p id="cf-t"></p><div class="row"><button type="button" id="cf-keep"></button><button type="button" id="cf-new" class="pri"></button></div></div>
    <button type="button" id="sh-add" aria-pressed="false" hidden>+ 더 짚기</button>
    <button type="button" id="sh-w" hidden>화면 전체로 바꾸기</button>
    <label for="sh-c" class="sr">글</label>
    <textarea id="sh-c" maxlength="1000" rows="3" enterkeyhint="enter" placeholder="무엇을 어떻게 바꾸면 좋을지 적어 주세요. 다른 곳을 짚으면 대상만 바뀌고 글은 남습니다."></textarea>
    <div class="row"><span id="sh-n">0/1000</span><button type="button" id="sh-x">취소</button><button type="button" id="sh-ok" class="pri" disabled>보내기</button></div>
    <p id="sh-h"></p>
  </section>
  <section id="mine" class="card" aria-labelledby="mine-h" hidden>
    <div class="head"><h2 id="mine-h">내 피드백</h2><p>이 브라우저에서 남긴 것</p><button type="button" id="mine-x" class="icon" aria-label="닫기">×</button></div>
    <ul id="mine-l"></ul>
  </section>
</main>
<div id="namebox" class="ov" role="dialog" aria-modal="true" aria-labelledby="name-h" hidden>
  <form id="nameform">
    <h1 id="name-h">화면 공유 보기</h1>
    <p>함께 보는 사람에게 보일 이름을 정하세요. 비워 두면 번호로 표시됩니다.</p>
    <label for="name">이름</label>
    <input id="name" maxlength="20" autocomplete="nickname" enterkeyhint="go">
    <button type="submit" class="pri">보기 시작</button>
  </form>
</div>
<textarea id="kbd" tabindex="-1" aria-label="기기로 보낼 키보드 입력" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
(() => {
const $ = (id) => document.getElementById(id);
const canvas = $('screen'), ctx = canvas.getContext('2d'), stage = $('stage'), kbd = $('kbd');
const BACKOFF = [1, 2, 4, 8, 15];
const NAME_KEY = 'qeploy-share-name', SECRET_KEY = 'qeploy-share-c';
const BTN = ['left', 'middle', 'right', 'back', 'forward'];

// 저장소는 사생활 모드·차단 설정에서 던질 수 있다. 없어도 페이지는 돈다.
function store(kind, key, val) {
  try {
    const s = window[kind];
    if (val === undefined) return s.getItem(key);
    if (val === null) s.removeItem(key); else s.setItem(key, val);
  } catch (_) { /* 무시 */ }
  return null;
}

const S = {
  ws: null, joined: false, everJoined: false, ended: '', name: '', secret: null,
  myId: null, myName: '', hasControl: false, pending: false, online: null,
  viewers: 0, controller: null, url: '', title: '', cfgW: 0, cfgH: 0,
  kind: 'WEB', format: 'jpeg', codec: '', noVideo: false, owner: false, toldOther: false,
  retry: 0, timer: 0, ttlEnd: 0, lastError: '', warned: false, pinOk: false, pinCaps: []
};
// 짚기(설계 §14·§15). marks 는 짚은 곳 ①~⑤이고, 하나라도 있으면 글 쓰는 창이 열려 있다. 곳마다 ref·point·result 와
// sent·acked(이 소켓에서 그 곳으로 보낸 짚기와 바로 온 답의 수), scope(범위 사다리에서 고른 칸), preview(마우스·포커스가 올라간
// 칸)를 가진다. 칸을 바꿔도 기기에 다시 묻지 않는다. adding 이면 다음 탭·끌기가 새 곳이고, conflict 는 화면이 바뀐 곳의 ref 다.
const P = {
  mode: false, lastSent: 0, keptAt: 0, queue: [], qTimer: 0, submitting: false, adding: false, conflict: null, skipClick: false
};
let marks = [], act = -1, refSeq = 0;
const A = () => marks[act] || null; // 지금 다루는 짚은 곳
let pinDrag = null; // 끌고 있는 영역(§15.4). 짚기 상태와 따로 둔다 — 끄는 동안에도 이전 짚기는 그대로다

// 내 제어 링크(#c=…): 비밀은 메모리(+이 탭의 sessionStorage, 새로고침 대비)에만 두고 주소창에서 바로 지운다.
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('c')) {
  S.secret = hash.get('c');
  store('sessionStorage', SECRET_KEY, S.secret);
  try { history.replaceState(history.state, '', location.pathname + location.search); } catch (_) { /* 무시 */ }
} else {
  S.secret = store('sessionStorage', SECRET_KEY);
}

let view = { x: 0, y: 0, w: 0, h: 0 }, bmp = null, busy = false, nextBuf = null;
let press = null, pendingMove = null, wheel = null, raf = 0, lastFlush = 0;
let lastDown = { t: 0, x: 0, y: 0, b: '', n: 0 }, composing = false, lastEsc = 0, toastTimer = 0;
const keysDown = new Map();

const text = (id, v) => { const el = $(id); if (el.textContent !== v) el.textContent = v; };
function notify(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastTimer = setTimeout(() => { t.textContent = ''; }, 300); }, 4000);
}

/* ---------- 소켓 ---------- */
function send(msg) {
  if (S.ws && S.ws.readyState === 1) { S.ws.send(JSON.stringify(msg)); return true; }
  return false;
}
// Android·iOS: 손가락을 해석하지 않고 그대로 보낸다(기기가 스크롤·길게 누르기를 안다).
const isDevice = () => S.kind === 'ANDROID' || S.kind === 'IOS';
// 짚기 모드에서는 조작권이 있어도 아무것도 기기로 보내지 않는다(설계 §14.1).
const canInput = () => S.joined && S.hasControl && !S.ended && S.online !== false && !P.mode;
const sendInput = (input) => canInput() && send({ type: 'input', input });

function connect() {
  clearTimeout(S.timer); S.timer = 0;
  if (S.ended) return;
  let ws;
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/__qeploy/ws');
  } catch (_) { retry(); return; }
  ws.binaryType = 'arraybuffer';
  S.ws = ws;
  let opened = false;
  ws.onopen = () => {
    if (ws !== S.ws) return;
    opened = true;
    const m = { type: 'join', name: S.name };
    if (S.secret) m.controlSecret = S.secret;
    ws.send(JSON.stringify(m));
  };
  ws.onmessage = (ev) => {
    if (ws !== S.ws) return;
    if (typeof ev.data === 'string') onText(ev.data);
    else if (S.format === 'h264') video.chunk(ev.data);
    else onFrame(ev.data);
  };
  ws.onclose = () => {
    if (ws !== S.ws) return;
    S.ws = null; S.joined = false; S.pending = false; S.online = null;
    video.close();
    pinSocketLost();
    setControl(false);
    if (S.ended) return;
    if (!opened) probe();
    retry();
  };
  render();
}
function retry() {
  if (S.ended || S.timer) return;

  mine = loadMine();
  const fresh = mine.filter((f) => !known.has(f.id)).map((f) => ({ id: f.id, key: f.key }));
  if (fresh.length) send({ type: 'feedback-watch', items: fresh });
  renderMine(); render();
});

/* ---------- 버튼·이름 ---------- */
$('b-req').addEventListener('click', () => {
  if (S.joined && !S.hasControl && !S.pending && send({ type: 'request-control' })) { S.pending = true; render(); }
});
$('b-rel').addEventListener('click', () => { send({ type: 'release-control' }); setControl(false); });
$('b-back').addEventListener('click', () => sendInput({ type: 'nav', action: 'back' }));
$('b-fwd').addEventListener('click', () => sendInput({ type: 'nav', action: 'forward' }));
$('b-reload').addEventListener('click', () => sendInput({ type: 'nav', action: 'reload' }));
$('b-kbd').addEventListener('click', () => {
  if (document.activeElement === kbd) kbd.blur(); // 닫힌 모바일 키보드를 다시 띄운다
  kbd.focus({ preventScroll: true });
});
$('nameform').addEventListener('submit', (e) => {
  e.preventDefault();
  S.name = $('name').value.trim().slice(0, 20);
  store('localStorage', NAME_KEY, S.name || null);
  $('namebox').hidden = true;
  connect();
});

new ResizeObserver(() => draw()).observe(stage);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!busy) pump();
  if (S.timer) connect();
});
addEventListener('online', () => { if (S.timer) connect(); });

let status = 0;
try { const nav = performance.getEntriesByType('navigation')[0]; status = (nav && nav.responseStatus) || 0; } catch (_) { /* 무시 */ }
if (status === 410 || status === 404) end('gone');
else if (S.secret) connect();
else {
  $('name').value = store('localStorage', NAME_KEY) || '';
  $('namebox').hidden = false;
  render();
  $('name').focus();
}
})();
</script>
</body>
</html>
